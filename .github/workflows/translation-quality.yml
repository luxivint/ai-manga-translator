name: Translation quality gates

on:
  push:
    branches:
      - fix/double-balloon-ocr-layout
  pull_request:
    paths:
      - "modules/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/translation-quality.yml"

jobs:
  geometry-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      USE_GPU: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify modified files compile
        run: python -m compileall -q modules scripts tests
      - name: Run balloon/OCR/cache/translation regression tests
        run: |
          for name in ocr_completeness double_balloon_regions linked_lobes white_balloon_interior gateway_cache_isolation gateway_cache translate_consistency balloon_layout upload_verify; do
            python -m unittest discover -v -s tests -p "test_${name}.py"
          done
